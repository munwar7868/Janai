name: Build Munawar AI APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using your release keystore."
          else
            echo "No KEYSTORE_BASE64 secret: APK will be signed with the debug key."
          fi

      - name: Build release APK
        id: build
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Show errors on the run summary page
        if: always()
        run: |
          {
            echo '## Build result: ${{ steps.build.outcome }}'
            echo 'If it failed, copy the lines below and send them to Claude.'
            echo '```'
            grep -E "^e: |error: |What went wrong|Execution failed" -A3 build.log | head -90 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Stop here if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MunawarAI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MunawarAI-apk
          path: MunawarAI.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags like v0.2.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MunawarAI.apk
          generate_release_notes: true
